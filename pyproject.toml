[project]
name = "cv-verifier"
version = "0.1.0"
description = "Multi-engine PDF extraction and ATS verification framework for CVs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pdfminer-six>=20240706",
    "unstructured[pdf]>=0.18.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "pytest>=8.0.0",
]

[project.scripts]
cv-verify = "cv_verifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
